# 홍보 대시보드 — 진안사우나 스레드 성과 수집 (하루 2회)
name: 홍보 대시보드 수집

on:
  schedule:
    - cron: "9 * * * *"     # 매시간 9분
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [metrics_collect.py, .github/workflows/metrics.yml]

concurrency:
  group: threads-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 스레드 성과 수집
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python metrics_collect.py threads_sauna
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "metrics-bot"
          git config user.email "bot@users.noreply.github.com"
          git add metrics/ || true
          git diff --cached --quiet && exit 0
          git commit -m "📊 홍보 대시보드 수치 $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "푸시 실패 ($i/5) — 10초 후 재시도"; sleep 10
          done
